@if (createdUser(); as user) {
  <div class="done">
    <app-alert variant="good" title="Compte créé">
      Bienvenue {{ user.firstName }} {{ user.lastName }}.
    </app-alert>
    <dl>
      <dt>Login</dt>
      <dd>{{ user.login }}</dd>
      <dt>E-mail</dt>
      <dd>{{ user.email }}</dd>
      <dt>Identifiant</dt>
      <dd>#{{ user.id }}</dd>
    </dl>
    <app-button variant="outline" [block]="true" (click)="restart()">Nouvelle inscription</app-button>
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-text-field label="Login" formControlName="login" autocomplete="nickname" [maxlength]="30" [error]="errors().login" />

    <div class="row">
      <app-text-field label="Nom" formControlName="lastName" autocomplete="family-name" [maxlength]="50" [error]="errors().lastName" />
      <app-text-field label="Prénom" formControlName="firstName" autocomplete="given-name" [maxlength]="50" [error]="errors().firstName" />
    </div>

    <app-text-field label="E-mail" type="email" formControlName="email" autocomplete="email" [maxlength]="100" [error]="errors().email" />
    <app-text-field label="Mot de passe" type="password" formControlName="password" autocomplete="new-password" [maxlength]="72" [error]="errors().password" />
    <app-text-field label="Confirmer le mot de passe" type="password" formControlName="confirmPassword" autocomplete="new-password" [maxlength]="72" [error]="errors().confirmPassword" />

    @if (errorMessage(); as message) {
      <app-alert variant="error">{{ message }}</app-alert>
    }

    <app-button type="submit" [block]="true" [loading]="loading()">
      {{ loading() ? 'Inscription…' : "S'inscrire" }}
    </app-button>
  </form>
}
